<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>课程表 - 锦晖小学一年级14班</title><style>*{margin:0;padding:0;box-sizing:border-box}
:root{

--radius:12px;--radius-lg:16px;
--grad-header:linear-gradient(135deg,#6366F1 0%,#8B5CF6 50%,#A78BFA 100%);
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:20px;line-height:1.6}
.container{max-width:1200px;margin:0 auto}
.header{background:var(--grad-header);color:white;padding:28px 36px;border-radius:var(--radius-lg);margin-bottom:20px;box-shadow:0 8px 32px rgba(99,102,241,0.25);position:relative;overflow:hidden}

.header{margin-bottom:20px}
.calendar-card{background:var(--card-bg);border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:20px;box-shadow:var(--shadow);border:1px solid var(--border-light)}
.calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.calendar-title{font-size:16px;font-weight:600;color:var(--text)}
.calendar-controls{display:flex;align-items:center;gap:8px}
.calendar-nav{display:flex;gap:6px}
.calendar-nav button{background:var(--border-light);border:none;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:16px;color:var(--primary);transition:all 0.2s;display:inline-flex;align-items:center;justify-content:center}
.calendar-nav button:hover{background:var(--primary);color:white;transform:scale(1.05)}
.btn-toggle{background:var(--primary);color:white;border:none;padding:7px 16px;border-radius:8px;cursor:pointer;font-size:13px;transition:all 0.2s;font-weight:500}

.week-cell.workday .wk-tag{background:#CA8A04;color:white}

.week-cell.other-month{opacity:0.4}
.calendar-month-view{display:none}

.calendar-week-view.hidden{display:none}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}

.calendar-legend{display:flex;justify-content:center;gap:14px;margin-top:12px;font-size:11px;color:var(--text-light);flex-wrap:wrap}
.calendar-legend .lg{display:inline-flex;align-items:center;gap:4px}
.calendar-legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
.account-bar{display:flex;align-items:center;justify-content:space-between;background:var(--card-bg);padding:12px 22px;border-radius:var(--radius);margin-bottom:16px;box-shadow:var(--shadow-sm);border:1px solid var(--border-light);flex-wrap:wrap;gap:10px}
.account-info{display:flex;align-items:center;gap:10px;font-size:14px}

.account-info .username{font-weight:600;color:var(--text)}
.account-info .guest{color:var(--text-light)}
.account-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn-sm{background:var(--border-light);color:var(--primary);border:1px solid var(--border);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;transition:all 0.2s;font-weight:500}
.btn-sm:hover{background:var(--primary);color:white;border-color:var(--primary);transform:translateY(-1px)}
.btn-sm.danger{color:#EF4444}
.btn-sm.danger:hover{background:#EF4444;color:white;border-color:#EF4444}
.btn-sm.success{color:#10B981}
.btn-sm.success:hover{background:#10B981;color:white;border-color:#10B981}
.auth-modal{display:none}
.auth-modal.show{display:flex}

.auth-modal input{width:100%;padding:11px 16px;border:1px solid var(--border);border-radius:10px;font-size:14px;margin-bottom:12px;box-sizing:border-box;transition:border-color 0.2s}
.auth-modal input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,0.1)}

.edit-badge{display:inline-block;background:var(--accent);color:white;padding:2px 8px;border-radius:4px;font-size:11px;margin-left:8px;animation:pulse 2s infinite}

.toolbar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px;background:var(--card-bg);padding:14px 22px;border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border-light)}

.btn{background:var(--primary);color:white;border:none;padding:8px 18px;border-radius:10px;cursor:pointer;font-size:13px;transition:all 0.2s;font-weight:500}

.row-morning td.subject{background:var(--morning)}
.row-noon td.subject{background:var(--noon)}
.row-afternoon td.subject{background:var(--afternoon)}

.schedule td.current .subject-teacher{color:rgba(255,255,255,0.9)!important}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,0.5)}50%{box-shadow:0 0 0 10px rgba(245,158,11,0)}}
.schedule td.empty{background:#FAFBFC;color:var(--text-lighter)}
.section-divider td{background:linear-gradient(90deg,transparent,var(--border),transparent);padding:4px;font-size:12px;color:var(--text-light);letter-spacing:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:20px}
.stat-card{background:var(--card-bg);padding:18px;border-radius:var(--radius);box-shadow:var(--shadow-sm);border:1px solid var(--border-light);text-align:center;transition:all 0.2s}

.stat-card .num{font-size:26px;font-weight:700;color:var(--primary)}
.stat-card .label{font-size:13px;color:var(--text-light);margin-top:4px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,0.6);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center}

.modal-content{background:white;padding:28px;border-radius:var(--radius-lg);max-width:400px;width:90%;box-shadow:0 16px 48px rgba(0,0,0,0.2)}

.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:768px){body{padding:10px}.header{padding:18px 22px}.header h1{font-size:22px}.schedule th,.schedule td{padding:6px 2px;font-size:11px}.subject-name{font-size:12px}.subject-teacher{font-size:10px}.period-time{font-size:10px}.schedule .period-col{width:80px}.week-cell .wk-day{font-size:18px}.week-cell{min-height:78px;padding:8px 2px}.week-cell .wk-tag{font-size:9px;padding:1px 4px}}</style></head><body><div class="container"><div class="header"><h1>📚 课程表</h1><div class="info"><span>📅 2026-2027学年第一学期</span><span>🏫 锦晖小学金融城分校</span><span>🎓 一年级14班</span><span>👩‍🏫 班主任：易鑫月</span></div></div><div class="calendar-card"><div class="calendar-header"><div class="calendar-title" id="calTitle">2026年8月</div><div class="calendar-controls"><div class="calendar-nav"><button onclick="changePrev()" title="上一周/上一月">‹</button><button onclick="goToday()" title="回到今天">●</button><button onclick="changeNext()" title="下一周/下一月">›</button></div><button class="btn-toggle" id="toggleViewBtn" onclick="toggleView()">展开当月 ▾</button></div></div><div class="calendar-week-view" id="weekView"></div><div class="calendar-month-view" id="monthView"><div class="calendar-grid" id="calendarGrid"></div></div><div class="calendar-legend"><span class="lg"><span class="dot" style="background:#FDECEA;border:1px solid #C0392B"></span>假日</span><span class="lg"><span class="dot" style="background:#FEF9E7;border:1px solid #856404"></span>调休上班</span><span class="lg"><span class="dot" style="background:#E8F8F0;border:1px solid #27AE60"></span>学校安排</span><span class="lg"><span class="dot" style="background:#EBF5FB;border:1px solid #3498DB"></span>节日/纪念日</span><span class="lg"><span class="dot" style="background:var(--primary)"></span>今天</span></div></div><div class="account-bar" id="accountBar"><div class="account-info" id="accountInfo"><div class="avatar">G</div><span class="guest">未登录 — 请登录后可自定义课程表</span></div><div class="account-actions" id="accountActions"><button class="btn-sm" onclick="openAuth('login')">登录</button><button class="btn-sm success" onclick="openAuth('register')">注册</button></div></div><div class="holiday-banner" id="holidayBanner"></div><div class="toolbar"><div class="legend"><span class="legend-item"><span class="legend-dot" style="background:var(--morning)"></span>上午</span><span class="legend-item"><span class="legend-dot" style="background:var(--noon)"></span>午休</span><span class="legend-item"><span class="legend-dot" style="background:var(--afternoon)"></span>下午</span><span class="legend-item"><span class="legend-dot" style="background:var(--delay)"></span>延时服务</span><span class="legend-item"><span class="legend-dot" style="background:var(--current)"></span>当前课程</span></div><div class="actions"><button class="btn outline" onclick="highlightCurrent(true)">定位当前课</button><button class="btn outline" onclick="toggleTime()">显示/隐藏时间</button><button class="btn-sm" onclick="shareLink()">🔗 分享课表</button><button class="btn-sm" onclick="pushToday()">📱 推送今日课</button><button class="btn-sm" onclick="openPushSettings()">⚙️ 推送设置</button><button class="btn-sm success" id="editBtn" onclick="toggleEdit()" style="display:none">✏️ 编辑课程</button><button class="btn-sm" id="exportBtn" onclick="exportData()" style="display:none">📥 导出</button><button class="btn-sm" id="importBtn" onclick="document.getElementById('importFile').click()" style="display:none">📤 导入</button><input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)"></div></div><div class="schedule-wrapper"><table class="schedule" id="scheduleTable"><thead><tr><th>时间 / 节次</th><th>星期一</th><th>星期二</th><th>星期三</th><th>星期四</th><th>星期五</th></tr></thead><tbody id="scheduleBody"></tbody></table></div><div class="stats"><div class="stat-card"><div class="num">5</div><div class="label">每周天数</div></div><div class="stat-card"><div class="num">10</div><div class="label">每日节数</div></div><div class="stat-card"><div class="num">50</div><div class="label">每周总课时</div></div><div class="stat-card"><div class="num" id="currentPeriod">-</div><div class="label">当前节次</div></div></div></div><div class="modal" id="modal"><div class="modal-content"><h3 id="modalTitle">课程详情</h3><p id="modalSubject"></p><p id="modalTeacher"></p><p id="modalTime"></p><p id="modalDay"></p><button class="btn close" onclick="closeModal()">关闭</button></div></div><div class="modal auth-modal" id="pushModal"><div class="modal-content"><h3>📱 WxPusher推送设置</h3><p style="font-size:13px;color:var(--text-light);margin-bottom:12px">在 <a href="https://wxpusher.zjiecode.com/" target="_blank">WxPusher</a> 扫码关注后，在「用户管理」中获取您的 UID</p><input type="text" id="pushUid" placeholder="您的UID" style="margin-bottom:8px"><label style="font-size:13px;display:flex;align-items:center;gap:6px;margin-bottom:12px"><input type="checkbox" id="pushAuto" style="width:auto">每天8:00自动推送今日课程</label><button class="btn" onclick="savePushSettings()" style="width:100%">保存设置</button><button class="btn-sm" onclick="document.getElementById('pushModal').classList.remove('show')" style="width:100%;margin-top:8px">取消</button></div></div><div class="toast" id="toast"></div><div class="modal auth-modal" id="authModal"><div class="modal-content"><div class="auth-tabs"><div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">登录</div><div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">注册</div></div><input type="text" id="authUser" placeholder="用户名" autocomplete="username"><input type="password" id="authPass" placeholder="密码" autocomplete="current-password"><button class="btn" id="authSubmit" onclick="submitAuth()" style="width:100%">登录</button><button class="btn-sm" onclick="closeAuth()" style="width:100%;margin-top:8px">取消</button></div></div><script>const holidays2026 = {

function pad(n) { return n < 10 ? "0" + n : "" + n; }
function dateKey(y, m, d) { return `${y}-${pad(m+1)}-${pad(d)}`; }
function sameDay(a, b) { return a.toDateString() === b.toDateString(); }
function getWeekStart(d) {
const s = new Date(d);
s.setHours(0,0,0,0);
s.setDate(s.getDate() - s.getDay());
return s;
}
function getWeekNumber(d) {
const start = new Date(d.getFullYear(), 0, 1);
const diff = (d - start) / 86400000 + start.getDay() + 1;
return Math.ceil(diff / 7);
}
function getDayInfo(date) {
const y = date.getFullYear();
const m = date.getMonth();
const d = date.getDate();
const dow = date.getDay();
const key = dateKey(y, m, d);
const hol = holidays2026[key];
const evt = schoolEvents2026[key];
const fest = festivals2026[key];
const mark = evt || hol || fest;
return { y, m, d, dow, key, hol, evt, fest, mark, isToday: sameDay(date, today) };
}
function renderWeekView() {
const start = getWeekStart(weekRef);
const container = document.getElementById("weekView");
container.innerHTML = "";
const dows = ["周日","周一","周二","周三","周四","周五","周六"];
const monthNames = start.getMonth() === (new Date(start.getTime()+6*86400000)).getMonth()
? `${start.getFullYear()}年${start.getMonth()+1}月`
: `${start.getFullYear()}年${start.getMonth()+1}月–${(new Date(start.getTime()+6*86400000)).getMonth()+1}月`;
document.getElementById("calTitle").textContent = `${monthNames} · 第${getWeekNumber(start)}周`;
for (let i = 0; i < 7; i++) {
const date = new Date(start.getTime() + i * 86400000);
const info = getDayInfo(date);
const cell = document.createElement("div");
cell.className = "week-cell";
if (info.dow === 0 || info.dow === 6) cell.classList.add("weekend");
if (info.mark) cell.classList.add(info.mark.type);
if (info.isToday) cell.classList.add("today");
let html = `<div class="wk-dow">${dows[i]}</div><div class="wk-day">${info.d}</div>`;
if (info.mark) html += `<div class="wk-tag">${info.mark.name}</div>`;
cell.innerHTML = html;
cell.title = `${info.y}年${info.m+1}月${info.d}日 ${info.mark ? info.mark.name : ""}`;
container.appendChild(cell);
}
}
function renderMonthView() {
const year = calDate.getFullYear();
const month = calDate.getMonth();
document.getElementById("calTitle").textContent = `${year}年${month+1}月`;
const grid = document.getElementById("calendarGrid");
grid.innerHTML = "";
const weeks = ["日","一","二","三","四","五","六"];
weeks.forEach((w, i) => {
const el = document.createElement("div");
el.className = "calendar-week" + (i === 0 || i === 6 ? " weekend" : "");
el.textContent = w;
grid.appendChild(el);
});
const firstDay = new Date(year, month, 1).getDay();
const daysInMonth = new Date(year, month + 1, 0).getDate();
for (let i = 0; i < firstDay; i++) {
const el = document.createElement("div");
el.className = "calendar-day empty";
grid.appendChild(el);
}
for (let d = 1; d <= daysInMonth; d++) {
const el = document.createElement("div");
el.className = "calendar-day";
const date = new Date(year, month, d);
const info = getDayInfo(date);
if (info.dow === 0 || info.dow === 6) el.classList.add("weekend");
if (info.mark) el.classList.add(info.mark.type);
if (info.isToday) el.classList.add("today");
let html = `<span class="day-num">${d}</span>`;
if (info.mark) html += `<span class="day-tag">${info.mark.name}</span>`;

}
}

function getCurrentPeriod() {
const now = new Date();
const day = now.getDay();
const todayKey = dateKey(now.getFullYear(), now.getMonth(), now.getDate());
const todayHol = holidays2026[todayKey];
if (todayHol && todayHol.type === "holiday") {
return { period: "放假", idx: -1, day: day, holiday: todayHol.name };
}
const isWorkday = todayHol && todayHol.type === "workday";
if (!isWorkday && (day === 0 || day === 6)) return { period: "周末", idx: -1, day: day };
const minutes = now.getHours() * 60 + now.getMinutes();
const timeRanges = [
{ start: 8*60+30, end: 9*60+0, idx: 0 },
{ start: 9*60+30, end: 10*60+0, idx: 1 },
{ start: 10*60+15, end: 10*60+45, idx: 2 },
{ start: 11*60+0, end: 11*60+30, idx: 3 },
{ start: 11*60+45, end: 12*60+15, idx: 4 },
{ start: 12*60+15, end: 13*60+45, idx: 5 },
{ start: 14*60+0, end: 14*60+30, idx: 6 },
{ start: 14*60+45, end: 15*60+15, idx: 7 },
{ start: 15*60+30, end: 16*60+5, idx: 8 },
{ start: 16*60+15, end: 16*60+50, idx: 9 },
{ start: 17*60+0, end: 17*60+35, idx: 10 }
];
for (const r of timeRanges) {
if (minutes >= r.start && minutes <= r.end) {
return { period: scheduleData[r.idx].period, idx: r.idx, day: day, time: scheduleData[r.idx].time };
}
}
return { period: "课间", idx: -1, day: day };
}

}

else showToast("当前无课程安排");
}
}
