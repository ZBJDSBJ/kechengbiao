];

const tabs=document.getElementById('tabs');
const content=document.getElementById('content');
let activeId=1;

function render(){
tabs.innerHTML=promos.map(p=>`<div class="tab${p.id===activeId?' active':''}" onclick="switchTab(${p.id})">${p.tab}</div>`).join('');
content.innerHTML=promos.filter(p=>p.id===activeId).map(p=>`
<div class="card">
<div class="card-preview">${p.html}</div>
<div class="card-info">
<div class="card-title">${p.title}</div>
<div class="tags">${p.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>
<div class="card-text">${p.text}</div>
<div class="card-copy" onclick="copyText(${p.id})">📋 复制文案</div>
</div>
</div>
`).join('');
}

function switchTab(id){activeId=id;render()}

function copyText(id){
const p=promos.find(x=>x.id===id);
const full=p.title+'\n\n'+p.text+'\n\n'+p.tags.join(' ');
navigator.clipboard.writeText(full).then(()=>alert('已复制！可直接粘贴到小红书'));
}

render();
</script>
